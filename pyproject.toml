[project]
name = "agent-harness-course-tooling"
version = "0.1.0"
description = "Offline tooling for the cumulative Agent Harness course"
requires-python = ">=3.11"
dependencies = [
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "openai>=1.40,<3",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29,<8",
  "mypy>=1.11,<2",
  "pip>=24",
  "pytest>=8.2,<9",
  "setuptools>=68",
  "wheel>=0.43",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
