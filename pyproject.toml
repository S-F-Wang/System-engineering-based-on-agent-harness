[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "1.0.0"
description = "Reusable agent harness generated by a cumulative nine-chapter course"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openai>=1.40,<3",
  "platformdirs>=4.2,<5",
]

[project.scripts]
omega = "agent_harness.cli:main"

[dependency-groups]
course = [
  "ipykernel>=6.29,<8",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
]
dev = [
  "mypy>=1.11,<2",
  "pip>=24",
  "pytest>=8.2,<9",
  "setuptools>=68",
  "wheel>=0.43",
]

[tool.uv]
default-groups = ["course", "dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "agent_harness.coding"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "agent_harness.persistence"
disable_error_code = ["attr-defined", "unused-ignore"]
