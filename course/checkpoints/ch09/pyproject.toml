[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "1.0.0"
description = "Reusable agent harness with Omega CLI and local Run evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openai>=1.40,<3",
  "platformdirs>=4.2,<5",
]

[project.scripts]
omega = "agent_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
